<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-label="dynamic verification">
<rect width="960" height="400" fill="#f8fafc"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker></defs>
<text x="28" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Dynamic verification: intercept a real request locally</text>
<text x="28" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">no real credentials, no traffic leaves the machine — the server logs the body and returns 400</text>
<rect x="28" y="92" width="250" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="42" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">claude -p</text>
<text x="42" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">CLAUDE_CONFIG_DIR=&lt;empty&gt;</text>
<text x="42" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">ANTHROPIC_API_KEY=sk-ant-dummy</text>
<text x="42" y="168" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">ANTHROPIC_BASE_URL=127.0.0.1</text>
<rect x="355" y="92" width="250" height="92" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="369" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">capture server</text>
<text x="369" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">logs body → captured/*.json</text>
<text x="369" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">then 400, never forwards</text>
<rect x="682" y="92" width="250" height="92" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="696" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">comparison</text>
<text x="696" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">3 system blocks, 20 tools</text>
<text x="696" y="152" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">lean 5.8 KB vs full 27 KB</text>
<line x1="278" y1="138" x2="351" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
<line x1="605" y1="138" x2="678" y2="138" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/>
<rect x="28" y="204" width="440" height="172" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="42" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">confirmed</text>
<text x="42" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">· billing header = block 0, no cache_control</text>
<text x="42" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">· identity = block 1, ephemeral</text>
<text x="42" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">· body = block 2, ephemeral</text>
<text x="42" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">· tool descriptions come in two sizes</text>
<text x="42" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">  (Bash 1,097 → 9,438 chars)</text>
<text x="42" y="328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">· # Harness belongs to the lean body</text>
<text x="42" y="344" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">· only 20 tools shipped (no TodoWrite)</text>
<rect x="492" y="204" width="440" height="172" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="506" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">corrected</text>
<text x="506" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">The 3rd system-reminder wording was attributed to</text>
<text x="506" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">&quot;coordinator mode&quot; — wrong. Real trigger:</text>
<text x="506" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280"></text>
<text x="506" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">Dao(model) = p8(model) &amp;&amp; !xQn(model) &amp;&amp; !ujo(model)</text>
<text x="506" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280"></text>
<text x="506" y="328" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">p8 reads the model&#x27;s midConversationSystem capability.</text>
<text x="506" y="344" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280">Verified: claude-opus-5-5 gets this variant.</text>
</svg>
